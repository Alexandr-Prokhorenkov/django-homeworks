services:

  db:
    image: postgres:16
    container_name: stocks_postgres

    environment:
      POSTGRES_DB: netology_stocks_products
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d netology_stocks_products"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app-network


  backend:
    build: .
    container_name: stocks_backend

    environment:
      POSTGRES_DB: netology_stocks_products
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - static_volume:/app/staticfiles

    networks:
      - app-network


  nginx:
    image: nginx:alpine
    container_name: stocks_nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/staticfiles:ro

    depends_on:
      - backend

    networks:
      - app-network


volumes:
  postgres_data:
  static_volume:


networks:
  app-network: